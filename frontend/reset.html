<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer contraseña · Inventorio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

<button type="button" class="theme-toggle-floating" data-theme-toggle aria-label="Cambiar tema"></button>

<main class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">
      <svg class="auth-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="11" width="18" height="10" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      <h1 class="auth-title">Nueva contraseña</h1>
      <p class="auth-sub">Elige una contraseña segura para tu cuenta</p>
    </div>

    <form id="resetForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="password">Nueva contraseña</label>
        <div class="input-password">
          <input class="input" type="password" id="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" required>
          <button type="button" class="toggle-eye" id="toggleEye1" aria-label="Mostrar u ocultar contraseña">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="pw-strength" id="pwStrength" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="pw-hint" id="pwHint">Usa al menos 6 caracteres. Se recomiendan letras y números.</div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password2">Confirmar contraseña</label>
        <div class="input-password">
          <input class="input" type="password" id="password2" placeholder="Repite la contraseña" autocomplete="new-password" required>
          <button type="button" class="toggle-eye" id="toggleEye2" aria-label="Mostrar u ocultar contraseña">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div id="msg" class="auth-alert" style="display:none" role="alert" aria-live="assertive"></div>

      <button id="btnReset" type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:.4rem;">
        <span class="btn-label">Restablecer contraseña</span>
      </button>
    </form>

    <div class="auth-footer">
      <a href="./index.html">← Regresar al inicio de sesión</a>
    </div>
  </div>
</main>

<p class="auth-copy">© 2026 Dotaciones Zambrano · Desarrollado por Jhonatan Zambrano</p>

<script src="./config.js"></script>
<script src="./theme.js"></script>
<script src="./ui.js"></script>
<script>
  const token = new URLSearchParams(window.location.search).get('token');
  const form = document.getElementById('resetForm');
  const pw1 = document.getElementById('password');
  const pw2 = document.getElementById('password2');
  const btn = document.getElementById('btnReset');
  const btnLabel = btn.querySelector('.btn-label');
  const msg = document.getElementById('msg');
  const strengthEl = document.getElementById('pwStrength');
  const hintEl = document.getElementById('pwHint');

  document.getElementById('toggleEye1').addEventListener('click', () => togglePw(pw1));
  document.getElementById('toggleEye2').addEventListener('click', () => togglePw(pw2));
  function togglePw(el) { el.type = el.type === 'password' ? 'text' : 'password'; }

  function setMsg(text, ok) {
    msg.textContent = text;
    msg.className = 'auth-alert' + (ok ? ' auth-alert-success' : '');
    msg.style.display = text ? 'block' : 'none';
  }

  function scoreOf(pw) {
    let s = 0;
    if (pw.length >= 6) s++;
    if (pw.length >= 10) s++;
    if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) s++;
    if (/\d/.test(pw) && /[^A-Za-z0-9]/.test(pw)) s++;
    return s;
  }
  const LEVELS = ['', 'weak', 'medium', 'strong', 'very-strong'];
  const LABELS = ['', 'Débil', 'Aceptable', 'Fuerte', 'Excelente'];

  pw1.addEventListener('input', () => {
    const s = scoreOf(pw1.value);
    strengthEl.className = 'pw-strength ' + LEVELS[s];
    hintEl.textContent = pw1.value ? LABELS[s] || 'Débil' : 'Usa al menos 6 caracteres. Se recomiendan letras y números.';
  });

  function setLoading(loading) {
    btn.disabled = loading;
    btnLabel.textContent = loading ? 'Procesando…' : 'Restablecer contraseña';
    if (loading) {
      const sp = document.createElement('span');
      sp.className = 'btn-spinner'; sp.id = '__spin';
      btn.prepend(sp);
    } else {
      const sp = btn.querySelector('#__spin');
      if (sp) sp.remove();
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    reset();
  });

  function reset() {
    setMsg('', false);
    const password = pw1.value;
    const confirm = pw2.value;

    if (password.length < 4) {
      setMsg('La contraseña es demasiado corta', false);
      showToast('Ingresa una contraseña más segura', 'error');
      return;
    }
    if (password !== confirm) {
      setMsg('Las contraseñas no coinciden', false);
      showToast('Las contraseñas no coinciden', 'error');
      return;
    }

    setLoading(true);

    fetch('/ResetPassword', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ token, password })
    })
    .then(r => r.json())
    .then(res => {
      setLoading(false);
      if (res.error) {
        setMsg(`Error: ${res.error}`, false);
        showToast(`Error: ${res.error}`, 'error');
        return;
      }
      setMsg('Contraseña actualizada. Redirigiendo…', true);
      showToast('Contraseña actualizada', 'success');
      setTimeout(() => { window.location.href = 'index.html'; }, 800);
    })
    .catch(() => {
      setLoading(false);
      setMsg('Error de conexión con el servidor', false);
      showToast('Error de conexión', 'error');
    });
  }
</script>
</body>
</html>
