<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña · Inventorio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

<button type="button" class="theme-toggle-floating" data-theme-toggle aria-label="Cambiar tema"></button>

<main class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">
      <svg class="auth-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="5" width="18" height="14" rx="2"/>
        <path d="M3 7l9 6 9-6"/>
      </svg>
      <h1 class="auth-title">Recuperar contraseña</h1>
      <p class="auth-sub">Te enviaremos un enlace seguro a tu correo</p>
    </div>

    <form id="recoverForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Correo electrónico</label>
        <input class="input" type="email" id="email" placeholder="tu@correo.com" autocomplete="email" required>
      </div>

      <div id="msg" class="auth-alert" style="display:none" role="alert" aria-live="polite"></div>

      <button id="btnSend" type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:.4rem;">
        <span class="btn-label">Enviar enlace</span>
      </button>
    </form>

    <div class="auth-footer">
      <a href="./index.html">← Volver al inicio de sesión</a>
    </div>
  </div>
</main>

<p class="auth-copy">© 2026 Dotaciones Zambrano · Desarrollado por Jhonatan Zambrano</p>

<script src="./config.js"></script>
<script src="./theme.js"></script>
<script src="./ui.js"></script>
<script>
  const form = document.getElementById('recoverForm');
  const inputEmail = document.getElementById('email');
  const btnSend = document.getElementById('btnSend');
  const btnLabel = btnSend.querySelector('.btn-label');
  const msg = document.getElementById('msg');

  function setMsg(text, type) {
    msg.textContent = text;
    msg.className = 'auth-alert' + (type === 'success' ? ' auth-alert-success' : '');
    msg.style.display = text ? 'block' : 'none';
  }

  function setLoading(loading) {
    btnSend.disabled = loading;
    btnLabel.textContent = loading ? 'Enviando…' : 'Enviar enlace';
    if (loading) {
      const sp = document.createElement('span');
      sp.className = 'btn-spinner';
      sp.id = '__spin';
      btnSend.prepend(sp);
    } else {
      const sp = btnSend.querySelector('#__spin');
      if (sp) sp.remove();
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    recuperar();
  });

  function recuperar() {
    const email = inputEmail.value.trim();
    setMsg('', '');

    if (!email) {
      setMsg('Debes ingresar tu correo', 'error');
      showToast('Debes ingresar tu correo', 'error');
      return;
    }

    setLoading(true);

    fetch('/RecuperarPassword', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    })
    .then(r => r.json())
    .then(res => {
      setLoading(false);
      if (!res.ok) {
        setMsg(res.error || 'Error al enviar correo', 'error');
        showToast(res.error || 'Error al enviar correo', 'error');
        return;
      }
      setMsg('Si el correo existe, recibirás un enlace en unos minutos.', 'success');
      showToast('Revisa tu correo para continuar', 'success');
      inputEmail.value = '';
    })
    .catch(() => {
      setLoading(false);
      setMsg('Error de conexión con el servidor', 'error');
      showToast('Error de conexión', 'error');
    });
  }
</script>

</body>
</html>
