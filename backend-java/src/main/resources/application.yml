spring:
  application:
    name: inventorio
  # Soporta ejecutar desde la raiz del repositorio o desde backend-java/.
  # El archivo application-secrets.yml esta en .gitignore.
  config:
    import:
      - "optional:file:./backend-java/application-secrets.yml"
      - "optional:file:./application-secrets.yml"
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: false
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: ${PORT:8080}
  # Cookie de sesión para el despliegue same-origin.
  servlet:
    session:
      cookie:
        name: SESSION
        same-site: none
        secure: true
        http-only: true
        path: /
      timeout: 7d
  forward-headers-strategy: framework

voice-assistant:
  gemini:
    base-url: https://generativelanguage.googleapis.com/v1beta
    model: gemini-3.6-flash
    live-model: gemini-3.8-live

app:
  # Base URL del frontend, usada para el enlace de recuperacion en el correo.
  reset-base-url: ${RESET_BASE_URL:http://localhost:8080}
  # Datos de la empresa para el reporte PDF (no sensibles)
  report:
    company-name: ${REPORT_COMPANY_NAME:Nombre de la empresa}
    company-logo: ${REPORT_COMPANY_LOGO:}
    company-address: ${REPORT_COMPANY_ADDRESS:Direccion de la empresa}
    company-phone: ${REPORT_COMPANY_PHONE:Numero de celular}

# Configuracion de logging basica
logging:
  level:
    root: INFO
    com.dotacioneszambrano.inventorio: INFO
